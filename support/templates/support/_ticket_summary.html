<div class="bg-base-100 border border-base-200 rounded-2xl p-5 shadow-sm grid md:grid-cols-4 gap-5">
    <div>
        <p class="text-[11px] uppercase tracking-wide font-semibold text-base-content/50 mb-1">Status</p>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold
            {% if ticket.status == 'open' %} bg-amber-50 text-amber-700
            {% elif ticket.status == 'in_progress' %} bg-sky-50 text-sky-700
            {% else %} bg-emerald-50 text-emerald-700 {% endif %}">
            <span class="w-1.5 h-1.5 rounded-full
                {% if ticket.status == 'open' %} bg-amber-500
                {% elif ticket.status == 'in_progress' %} bg-sky-500
                {% else %} bg-emerald-500 {% endif %}"></span>
            {{ ticket.get_status_display }}
        </span>
    </div>
    <div>
        <p class="text-[11px] uppercase tracking-wide font-semibold text-base-content/50 mb-1">Priority</p>
        <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold
            {% if ticket.priority == 'low' %} bg-emerald-50 text-emerald-700
            {% elif ticket.priority == 'medium' %} bg-amber-50 text-amber-700
            {% else %} bg-red-50 text-red-700 {% endif %}">
            {{ ticket.get_priority_display }}
        </span>
    </div>
    <div>
        <p class="text-[11px] uppercase tracking-wide font-semibold text-base-content/50 mb-1">Created</p>
        <p class="text-sm font-semibold">{{ ticket.created_at|date:"M d, Y H:i" }}</p>
    </div>
    <div>
        <p class="text-[11px] uppercase tracking-wide font-semibold text-base-content/50 mb-1">Raised by</p>
        <p class="text-sm font-semibold">{{ ticket.user.username }}</p>
        <p class="text-xs text-base-content/50">{{ ticket.user.email }}</p>
    </div>
    <div class="md:col-span-4 pt-3 border-t border-base-200">
        <p class="text-[11px] uppercase tracking-wide font-semibold text-base-content/50 mb-1">Description</p>
        <p class="text-sm leading-relaxed">{{ ticket.description|linebreaksbr }}</p>
    </div>
</div>
